<!DOCTYPE html>
<html>
    <head>
        <title>FORM</title>
        <link rel="stylesheet" href="REGISTRATION.css">
    </head>
    <FORM>
        <h1 style="color: brown;">STUDENT DETAILS</h1>
        <label for="NAME">NAME :-</label>
        <input type="text" id="NAME" placeholder="capital"><br><br>
        <label for="class" >CLASS :-</label>
        <input type="number" id="class"><br><br>
        <label for="adhar">ADHAR</label>
        <input type="number" id="adhar" maxlength="12" required><br><br>
        <label for="male" >MALE :-</label>
        <input type="radio" id="male" name="gender" value="male"> <br><br>
        <label for="female">FEMALE :-</label>
        <input type="radio" id="female" name="gender" value="female"><br><br>
        <label for="father name">FATHER NAME :-</label>
        <input type="text" id="father name"><br><br>
        <label for="mother name">MOTHER NAME :-</label>
        <input type="text" id="mother name"><br><br>
        <label for="phone no">PHONE NO</label>
        <input type="number" id="phone no" maxlength="10" required><br><br>
        <img src="football.jpg" alt="football">
        <div style="color: aqua;">
        <label for="email">email</label>
        <input type="email" id="email"><br><br></div>
        <label for="religion"> RELIGION</label>
        <section id="religion">
            <option value="hindu">hindu</option>
            <input type="radio" id="hindu" name="religion" value="hindu">
            <option value="christian">christian</option>
            <input type="radio" id="christian" name="religion" value="christian">
            <option value="muslim">muslim</option>
            <input type="radio" id="muslim" name="religion" value="muslim">
        </section><b></b>
        <label for="password">PASSWORD :-</label>
        <input type="password" id="password" name="password" required><br><br>
        <label for="message">MESSAGE :-</label>
        <textarea id="message" rows="5" cols="60"></textarea><br><br>


<video width="400" height="500" controls>
    <source src="vedious/WhatsApp Video 2026-09-02 at 9.18.14 PM.mp4" type="video/mp4">
    
</video>



























</FORM>
</html>
